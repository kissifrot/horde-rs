[package]
name = "horde-rs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "An HTTP load testing tool"

[[bin]]
name = "horde"
path = "src/main.rs"

[features]
distributed-offline = ["hdrhistogram/serialization"]

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
futures-util = "0.3"
bytes = "1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
hdrhistogram = { version = "=7.6.0", default-features = false }
serde = { version = "1", features = ["derive"] }
jsonschema = { version = "0.60.2", default-features = false }
scraper = { version = "0.29.0", default-features = false }
serde_urlencoded = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
